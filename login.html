<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập & Đăng Ký - Phong Cách Xanh</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <!-- Header trang Auth -->
  <header class="auth-header">
    <a href="index.html" class="logo">
      <i class="fa-solid fa-leaf"></i>
      <span>Phong Cách Xanh</span>
    </a>
    <a href="index.html" class="auth-back-link">
      <i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ
    </a>
  </header>

  <!-- Khung nội dung đăng nhập / đăng ký -->
  <main class="auth-container">
    <div class="auth-card">
      
      <!-- Chuyển tab -->
      <div class="auth-tabs">
        <button type="button" class="auth-tab-btn active" id="tabBtnLogin">Đăng Nhập</button>
        <button type="button" class="auth-tab-btn" id="tabBtnRegister">Đăng Ký</button>
      </div>

      <div class="auth-card-body">
        
        <!-- Khung báo lỗi / thành công chung -->
        <div class="auth-alert" id="authAlert"></div>

        <!-- ================= FORM ĐĂNG NHẬP ================= -->
        <form id="loginForm">
          <h2 class="auth-form-title">Chào mừng trở lại!</h2>
          <p class="auth-form-sub">Đăng nhập tài khoản để tiếp tục mua sắm gear hoặc quản lý hệ thống.</p>

          <div class="auth-form-group">
            <label for="loginEmail">Email đăng nhập</label>
            <div class="auth-input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="loginEmail" placeholder="Nhập email của bạn..." required autofocus>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="loginPassword">Mật khẩu</label>
            <div class="auth-input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="loginPassword" placeholder="Nhập mật khẩu..." required>
              <i class="fa-regular fa-eye toggle-pwd" data-target="loginPassword"></i>
            </div>
          </div>

          <div class="auth-options-row">
            <label class="auth-remember">
              <input type="checkbox" id="loginRemember" checked>
              <span>Ghi nhớ đăng nhập</span>
            </label>
            <a href="#" class="auth-forgot-link" onclick="alert('Vui lòng liên hệ quản trị viên để cấp lại mật khẩu!'); return false;">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="auth-btn-submit" id="btnLoginSubmit">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
          </button>
        </form>

        <!-- ================= FORM ĐĂNG KÝ ================= -->
        <form id="registerForm" style="display: none;">
          <h2 class="auth-form-title">Tạo tài khoản mới</h2>
          <p class="auth-form-sub">Đăng ký thành viên để nhận ưu đãi và quản lý đơn hàng dễ dàng.</p>

          <div class="auth-form-group">
            <label for="regName">Họ và tên</label>
            <div class="auth-input-wrapper">
              <i class="fa-regular fa-user input-icon"></i>
              <input type="text" id="regName" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="regEmail">Email</label>
            <div class="auth-input-wrapper">
              <i class="fa-regular fa-envelope input-icon"></i>
              <input type="email" id="regEmail" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="regPhone">Số điện thoại</label>
            <div class="auth-input-wrapper">
              <i class="fa-solid fa-phone input-icon"></i>
              <input type="tel" id="regPhone" placeholder="090xxxxxxx" required>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="regPassword">Mật khẩu</label>
            <div class="auth-input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự..." required minlength="6">
              <i class="fa-regular fa-eye toggle-pwd" data-target="regPassword"></i>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="regConfirmPassword">Xác nhận mật khẩu</label>
            <div class="auth-input-wrapper">
              <i class="fa-solid fa-shield-halved input-icon"></i>
              <input type="password" id="regConfirmPassword" placeholder="Nhập lại mật khẩu..." required minlength="6">
            </div>
          </div>

          <button type="submit" class="auth-btn-submit" id="btnRegisterSubmit">
            <i class="fa-solid fa-user-plus"></i> Đăng Ký Tài Khoản
          </button>
        </form>

      </div>
    </div>
  </main>

  <footer class="auth-footer">
    <p>© 2026, Phong Cách Xanh - Gaming Gear Shop.</p>
  </footer>

  <!-- File logic xác thực -->
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
